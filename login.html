<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MORGUL STORE - Admin Login</title>
  <meta name="description" content="Halaman Login Admin MORGUL STORE untuk mengakses Backend Dashboard, Deposit, dan Penarikan Uang.">

  <!-- Favicon Tags -->
  <link rel="icon" type="image/png" href="assets/images/favicon.png">
  <link rel="shortcut icon" href="assets/images/favicon.ico">
  <link rel="apple-touch-icon" href="assets/images/favicon.png">

  <!-- FontAwesome & CSS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      background: radial-gradient(circle at 50% 30%, rgba(139, 92, 246, 0.2), transparent 60%),
                  radial-gradient(circle at 80% 80%, rgba(6, 182, 212, 0.15), transparent 50%),
                  var(--bg-dark);
    }
  </style>
</head>

<body>

  <!-- Clean Centered Login Card Container -->
  <div class="login-card" style="margin: auto;">
    
    <!-- Brand Header -->
    <a href="index.html" style="text-decoration: none; display: inline-block; margin-bottom: 0.5rem;">
      <img src="assets/images/logo.png" alt="MORGUL Logo" class="login-logo">
      <div class="brand-title" style="justify-content: center; font-size: 1.6rem;">
        MORGUL <span class="brand-badge">STORE</span>
      </div>
    </a>
    
    <p class="login-subtitle" style="margin-bottom: 1.75rem;">
      Masukan Username & Password untuk Mengakses Dashboard Backend
    </p>

    <!-- Error Alert Box -->
    <div id="loginErrorAlert" class="login-error-alert">
      <i class="fa-solid fa-triangle-exclamation"></i> <span id="loginErrorMsg">Username atau Password salah!</span>
    </div>

    <!-- Login Form -->
    <form onsubmit="handleLoginProcess(event)">
      
      <div class="login-input-group">
        <label for="loginUsername">Username Admin</label>
        <input type="text" id="loginUsername" class="login-input" placeholder="Masukkan username" required autocomplete="username">
        <i class="fa-solid fa-user"></i>
      </div>

      <div class="login-input-group">
        <label for="loginPassword">Password</label>
        <input type="password" id="loginPassword" class="login-input" placeholder="Masukkan password" required autocomplete="current-password">
        <i class="fa-solid fa-lock"></i>
      </div>

      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; font-size: 0.8rem; color: var(--text-muted);">
        <label style="display: flex; align-items: center; gap: 0.4rem; cursor: pointer; user-select: none;">
          <input type="checkbox" id="loginRememberMe" style="accent-color: var(--accent-purple);"> Ingat Saya
        </label>
        <span style="color: var(--accent-cyan); font-weight: 600;">Demo: admin / morgul123</span>
      </div>

      <button type="submit" class="btn-login-submit">
        <i class="fa-solid fa-right-to-bracket"></i> Login ke Dashboard
      </button>

      <div style="margin-top: 1.5rem; border-top: 1px solid var(--border-subtle); padding-top: 1rem;">
        <a href="index.html" style="color: var(--text-muted); text-decoration: none; font-size: 0.83rem; transition: color 0.2s;" onmouseover="this.style.color='#fff'" onmouseout="this.style.color='var(--text-muted)'">
          <i class="fa-solid fa-arrow-left"></i> Kembali ke Toko Utama
        </a>
      </div>

    </form>
  </div>

  <!-- Scripts -->
  <script src="js/auth.js"></script>
  <script>
    // Redirect to admin.html if already logged in
    document.addEventListener('DOMContentLoaded', () => {
      if (MorgulAuth.isLoggedIn()) {
        window.location.href = 'admin.html';
      }
    });

    function handleLoginProcess(e) {
      e.preventDefault();
      const user = document.getElementById('loginUsername').value;
      const pass = document.getElementById('loginPassword').value;
      const remember = document.getElementById('loginRememberMe').checked;

      const res = MorgulAuth.login(user, pass, remember);
      const errorBox = document.getElementById('loginErrorAlert');

      if (res.success) {
        if (errorBox) errorBox.style.display = 'none';
        // Redirect cleanly to admin dashboard
        window.location.href = 'admin.html';
      } else {
        if (errorBox) {
          document.getElementById('loginErrorMsg').textContent = res.message;
          errorBox.style.display = 'block';
        }
      }
    }
  </script>

</body>

</html>
